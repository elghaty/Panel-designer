plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.basha.paneldesigner'
    compileSdk 34

    defaultConfig {
        applicationId "com.basha.paneldesigner"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed debug signing key (checked into the repo as debug.keystore) so every
    // CI build produces the SAME signature. Without this, GitHub Actions
    // generates a new random debug key each run, and Android refuses to
    // install a new build over the previous one ("App not installed").
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
